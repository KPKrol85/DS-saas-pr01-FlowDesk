<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FlowDesk — Icon Lab</title>

    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;

        --page-bg: #f5f7fa;
        --card-bg: #ffffff;
        --text-primary: #172033;
        --text-secondary: #667085;
        --border-color: #d9dee8;
        --icon-color: #344054;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #111827;
          --card-bg: #1f2937;
          --text-primary: #f8fafc;
          --text-secondary: #aeb8c8;
          --border-color: #374151;
          --icon-color: #e5e7eb;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        background: var(--page-bg);
        color: var(--text-primary);
      }

      .icon-lab {
        width: min(1100px, 100%);
        margin-inline: auto;
      }

      .icon-lab__header {
        margin-bottom: 32px;
      }

      .icon-lab__title {
        margin: 0 0 8px;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
      }

      .icon-lab__description {
        max-width: 720px;
        margin: 0;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 16px;
      }

      .icon-card {
        display: grid;
        gap: 20px;
        min-height: 210px;
        padding: 24px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
      }

      .icon-card__preview {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 96px;
        color: var(--icon-color);
      }

      .icon-card__svg {
        display: block;
        width: 48px;
        height: 48px;
      }

      .icon-card__name {
        margin: 0;
        font-size: 1rem;
        text-align: center;
      }

      .icon-card__sizes {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: var(--icon-color);
      }

      .icon-card__sizes svg {
        display: block;
      }

      .icon-card__sizes svg:nth-child(1) {
        width: 16px;
        height: 16px;
      }

      .icon-card__sizes svg:nth-child(2) {
        width: 20px;
        height: 20px;
      }

      .icon-card__sizes svg:nth-child(3) {
        width: 24px;
        height: 24px;
      }
    </style>
  </head>
